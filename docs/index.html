<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louvores</title>
<meta name="description" content="Cifras e partituras de louvores — funciona sem internet.">
<meta name="theme-color" content="#8f1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Louvores">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v26M8 11h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <div>
        <h1>Louvores</h1>
        <p class="sub">Cifras e partituras para o louvor</p>
      </div>
    </div>
    <button id="offlineBtn" class="pill" type="button" aria-live="polite"><span class="dot"></span><span id="offlineTxt">Preparando…</span></button>
  </div>
</header>

<div class="searchbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Número, título ou trecho da letra">
    <button id="clear" class="clear" type="button" aria-label="Limpar" hidden>×</button>
  </div>
  <div class="chips" id="chips" role="tablist"></div>
</div>

<main>
  <div id="meta" class="meta"></div>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>Nenhum louvor encontrado.<br><span>Tente outra palavra ou um trecho diferente da letra.</span></p>
</main>

<section id="viewer" class="viewer" hidden aria-modal="true" role="dialog">
  <div class="vbar">
    <button id="vBack" class="vbtn" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="vtitle"><span id="vNum" class="vnum"></span><span id="vName"></span></div>
    <button id="vStar" class="vbtn" type="button" aria-label="Favoritar"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="vtools">
    <div class="seg" id="vDocs"></div>
    <div class="zoom">
      <button id="zOut" class="zbtn" type="button" aria-label="Diminuir">−</button>
      <span id="zVal">100%</span>
      <button id="zIn" class="zbtn" type="button" aria-label="Aumentar">+</button>
    </div>
  </div>
  <div id="pages" class="pages"></div>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
