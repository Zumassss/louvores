<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louvores</title>
<meta name="description" content="Cifras e partituras de louvores — funciona sem internet.">
<meta name="theme-color" content="#b3232a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Louvores">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/nunito-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <img class="logo" src="img/icm-white.svg" alt="Igreja Cristã Maranata" width="118" height="27">
      <div class="brand-text">
        <h1>Louvores</h1>
        <p class="sub">Cifras e partituras</p>
      </div>
    </div>
    <button id="offlineBtn" class="pill" type="button" aria-live="polite"><span class="dot"></span><span id="offlineTxt">Preparando…</span></button>
  </div>
</header>

<div class="searchbar" id="searchbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Número, título ou trecho da letra" aria-label="Buscar louvor">
    <button id="clear" class="clear" type="button" aria-label="Limpar busca" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
  <div class="chips" id="chips" role="tablist" aria-label="Filtros"></div>
</div>

<main>
  <div id="meta" class="meta"></div>
  <ul id="list" class="list"></ul>
  <div id="empty" class="empty" hidden>
    <img src="img/icm-red.svg" alt="" width="120" height="28">
    <p>Nenhum louvor encontrado.</p>
    <span>Tente outra palavra, o número ou um trecho diferente da letra.</span>
  </div>
  <footer class="foot"><img src="img/icm-red.svg" alt="" width="84" height="20"><span id="ver"></span></footer>
</main>

<section id="viewer" class="viewer" hidden aria-modal="true" role="dialog" aria-labelledby="vName">
  <header class="vbar">
    <button id="vBack" class="ib" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="vTitleBtn" class="vt" type="button" aria-label="Abrir menu"><span id="vName" class="vname"></span><span id="vSub" class="vsub"></span></button>
    <button id="vMenu" class="ib" type="button" aria-label="Menu" aria-controls="drawer" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  </header>
  <div id="pages" class="pages"></div>
  <div id="pageInd" class="page-ind" hidden></div>
  <button id="scrollFab" class="fab" type="button" hidden aria-label="Parar rolagem"><svg viewBox="0 0 24 24"><path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  <div id="drawerBg" class="drawer-bg" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Opções do louvor" aria-hidden="true">
    <div class="dh">
      <div class="dnum" id="dNum"></div>
      <div class="dtitle" id="dTitle"></div>
      <div class="dcol" id="dCol"></div>
    </div>
    <div class="dsec" id="secDocs"><div class="dlab">Ver</div><div id="dDocs" class="dlist" role="tablist"></div></div>
    <div class="dsec" id="secTom">
      <div class="dlab">Tom <span id="tomOrig" class="dhint"></span></div>
      <div class="drow"><button id="tomDown" class="dstep" type="button" aria-label="Meio tom abaixo">−½</button><div id="keyV" class="dval"></div><button id="tomUp" class="dstep" type="button" aria-label="Meio tom acima">+½</button></div>
      <div id="keyGrid" class="keys"></div>
      <button id="tomReset" class="dlink" type="button">Voltar ao tom original</button>
    </div>
    <div class="dsec">
      <div class="dlab">Tamanho</div>
      <div class="drow"><button id="zOut" class="dstep" type="button" aria-label="Diminuir">A−</button><button id="zVal" class="dval" type="button" aria-label="Tamanho normal">100%</button><button id="zIn" class="dstep" type="button" aria-label="Aumentar">A+</button></div>
    </div>
    <div class="dsec" id="secMode">
      <div class="dlab">Partitura</div>
      <div class="dseg"><button type="button" data-m="1">Só melodia</button><button type="button" data-m="0">Grade completa</button></div>
    </div>
    <div class="dsec" id="secChords">
      <label class="dsw"><span>Mostrar acordes</span><input type="checkbox" id="optChords" checked><i></i></label>
    </div>
    <div class="dsec">
      <div class="dlab">Rolagem automática</div>
      <div class="drow"><button id="scrollBtn" class="dplay" type="button">▶ Rolar</button><input id="scrollSpeed" type="range" min="1" max="10" step="1" aria-label="Velocidade"></div>
    </div>
    <div class="dsec dbtns">
      <button id="vStar" class="dbtn" type="button">☆ Favoritar</button>
      <button id="pasteBtn" class="dbtn" type="button">Colar uma cifra</button>
    </div>
  </aside>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
